site_name: Гайды для ЕГЭ по информатике 2027
site_description: Разборы заданий на Python
site_author: x1e7

use_directory_urls: false

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 2

nav:
  - Главная: index.md
  - Задание 1 - Схема дорог: task-1.md
  - Задание 8 - Перебор слов: task-8.md
  - Задание 13 - Количество программ: task-13.md
  - Задание 19–21 - Теория игр: task-19-21.md
  - Рекомендации: recommendations.md

extra_css:
  - stylesheets/extra.css
